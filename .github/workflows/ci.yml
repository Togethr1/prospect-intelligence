name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Install extension dependencies
        run: npm --prefix extension ci
      - name: Audit dependency advisories
        run: npm run audit:dependencies
      - name: Scan the complete Git history for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact=100 --max-archive-depth=3 --max-decode-depth=5
      - name: Security source check
        run: npm run security:check
      - name: Security regression tests
        run: npm test
      - name: Dashboard lint
        run: npm run lint
      - name: Dashboard build
        run: npm run build
      - name: Extension lint
        run: npm --prefix extension run lint
      - name: Extension build
        run: npm --prefix extension run build
